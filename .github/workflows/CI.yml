name: Physio Stress Emotion - CI Pipeline

on:
  push:
    branches:
      - feature/physio-stress-emotion
  pull_request:
    branches:
      - main

jobs:

  # ─────────────────────────────
  # JOB 1: Code Quality
  # ─────────────────────────────
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies + lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install flake8

      - name: Run flake8
        run: |
          flake8 src/ tests/ scripts/ \
          --max-line-length=120 \
          --ignore=E203,W503 \
          --exclude=__pycache__,.git

  # ─────────────────────────────
  # JOB 2: Unit Tests
  # ─────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies + test tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v \
          --cov=src \
          --cov-report=term-missing \
          --cov-fail-under=60 \
          --tb=short

  # ─────────────────────────────
  # JOB 3: Dataset Validation
  # ─────────────────────────────
  dataset-validation:
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal dependencies
        run: |
          pip install pandas numpy

      - name: Run dataset validation (if exists)
        run: |
          if [ -f "scripts/validate_datasets.py" ]; then
            python scripts/validate_datasets.py
          else
            echo "⚠️ validate_datasets.py not found, skipping..."
          fi

  # ─────────────────────────────
  # JOB 4: Preprocessing Check
  # ─────────────────────────────
  preprocessing-check:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true

      - name: Run preprocessing check (if exists)
        run: |
          if [ -f "scripts/check_preprocessing.py" ]; then
            python scripts/check_preprocessing.py
          else
            echo "⚠️ preprocessing script not found, skipping..."
          fi

  # ─────────────────────────────
  # JOB 5: Model Smoke Test
  # ─────────────────────────────
  model-smoke-test:
    runs-on: ubuntu-latest
    needs: [unit-tests, preprocessing-check]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true

      - name: Run model smoke test
        run: |
          if [ -f "scripts/smoke_test_model.py" ]; then
            python scripts/smoke_test_model.py
          else
            echo "⚠️ smoke test script not found, skipping..."
          fi

      - name: Comment on PR if failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Model smoke test failed. Check logs.'
            })