name: Physio Stress Emotion - CI Pipeline
 
on:
  push:
    branches:
      - feature/physio-stress-emotion
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
 
jobs:
  # ─────────────────────────────────────────
  # JOB 1: Code Quality (flake8 lint check)
  # ─────────────────────────────────────────
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Run flake8 lint
        run: |
          flake8 src/ tests/ scripts/ \
            --max-line-length=120 \
            --ignore=E203,W503 \
            --exclude=__pycache__,.git
        continue-on-error: false
 
  # ─────────────────────────────────────────
  # JOB 2: Unit Tests with coverage
  # ─────────────────────────────────────────
  unit-tests:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            --tb=short
 
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
 
  # ─────────────────────────────────────────
  # JOB 3: Dataset Validation
  # ─────────────────────────────────────────
  dataset-validation:
    name: Dataset Validation
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
 
      - name: Run dataset validation
        run: python scripts/validate_datasets.py
        env:
          DATA_DIR: data/
 
  # ─────────────────────────────────────────
  # JOB 4: Preprocessing Check
  # ─────────────────────────────────────────
  preprocessing-check:
    name: Preprocessing Module Check
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Check preprocessing modules load and run
        run: python scripts/check_preprocessing.py
 
  # ─────────────────────────────────────────
  # JOB 5: Model Smoke Test (PR to main only)
  # ─────────────────────────────────────────
  model-smoke-test:
    name: Model Smoke Test
    runs-on: ubuntu-latest
    needs: [unit-tests, preprocessing-check]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Run model smoke test
        run: python scripts/smoke_test_model.py
 
      - name: Comment on PR if smoke test fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Model smoke test failed** on `feature/physio-stress-emotion`.\n\nPlease check the Actions log and fix before this PR can be merged.\n\nRun `python scripts/smoke_test_model.py` locally to debug.'
            })
 