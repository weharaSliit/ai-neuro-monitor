name: Physio Stress Emotion - CI Pipeline

on:
  push:
    branches:
      - '**'        # runs on ALL branches 
  pull_request:
    branches:
      - main        # must pass before merging to main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Get code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install flake8 pytest pytest-cov

      # 4. Lint check (only existing folders)
      - name: Run flake8
        run: |
          DIRS=""
          [ -d "src" ] && DIRS="$DIRS src"
          [ -d "tests" ] && DIRS="$DIRS tests"

          if [ -n "$DIRS" ]; then
            flake8 $DIRS \
              --max-line-length=120 \
              --ignore=E203,W503 \
              --exclude=__pycache__,.git
          else
            echo "No folders to lint"
          fi

      # 5. Run unit tests (if available)
      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v \
              --cov=src \
              --cov-report=term-missing \
              --cov-fail-under=60 \
              --tb=short
          else
            echo "No tests found, skipping..."
          fi

      # 6. Optional scripts (safe execution)
      - name: Run optional checks
        run: |
          [ -f "scripts/validate_datasets.py" ] && python scripts/validate_datasets.py || echo "skip dataset validation"
          [ -f "scripts/check_preprocessing.py" ] && python scripts/check_preprocessing.py || echo "skip preprocessing"
          [ -f "scripts/smoke_test_model.py" ] && python scripts/smoke_test_model.py || echo "skip model test"