name: Physio Stress Emotion - CI Pipeline

on:
  push:
    branches:
      - feature/physio-stress-emotion
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'

jobs:

  # ─────────────────────────────────────────
  # JOB 1: Setup + Install (shared base)
  # ─────────────────────────────────────────
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies (safe)
        run: |
          python -m pip install --upgrade pip

          # ⚠️ Skip Windows-only packages
          grep -v "pywinpty" requirements.txt > requirements-ci.txt

          pip install -r requirements-ci.txt
          pip install flake8 pytest pytest-cov

  # ─────────────────────────────────────────
  # JOB 2: Code Quality
  # ─────────────────────────────────────────
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Run flake8
        run: |
          flake8 src/ tests/ scripts/ \
            --max-line-length=120 \
            --ignore=E203,W503 \
            --exclude=__pycache__,.git

  # ─────────────────────────────────────────
  # JOB 3: Unit Tests
  # ─────────────────────────────────────────
  unit-tests:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            --tb=short

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # ─────────────────────────────────────────
  # JOB 4: Dataset Validation
  # ─────────────────────────────────────────
  dataset-validation:
    name: Dataset Validation
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Run dataset validation
        run: python scripts/validate_datasets.py
        env:
          DATA_DIR: data/

  # ─────────────────────────────────────────
  # JOB 5: Preprocessing Check
  # ─────────────────────────────────────────
  preprocessing-check:
    name: Preprocessing Module Check
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Run preprocessing check
        run: python scripts/check_preprocessing.py

  # ─────────────────────────────────────────
  # JOB 6: Model Smoke Test
  # ─────────────────────────────────────────
  model-smoke-test:
    name: Model Smoke Test
    runs-on: ubuntu-latest
    needs: [unit-tests, preprocessing-check]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Run model smoke test
        run: python scripts/smoke_test_model.py

      - name: Comment on PR if failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Model smoke test failed. Check logs and fix before merging.'
            })